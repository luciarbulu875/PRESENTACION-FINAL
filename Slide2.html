        .bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.25) 100%);
            z-index: 1;
        }
        .slide-title { position: absolute; top: 35px; left: 50px; z-index: 100; }
        .slide-title h1 { font-size: 42px; font-weight: 900; color: #1e3a5f; text-shadow: 0 2px 8px rgba(255,255,255,0.9); margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; }
        .slide-title p { font-size: 18px; font-weight: 600; color: #334155; text-shadow: 0 1px 4px rgba(255,255,255,0.8); }
        .earth-slide-content { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 100px 50px 140px; }
        .earth-circle { position: relative; width: 380px; height: 380px; border-radius: 50%; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.15), inset 0 0 30px rgba(0,0,0,0.1); }
        .earth-liquid { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; transition: height 1.5s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column-reverse; overflow: hidden; }
        .liquid-segment { width: 100%; position: relative; flex-shrink: 0; transition: height 1s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .liquid-segment:hover { filter: brightness(1.1); }
        .liquid-segment .seg-label { position: absolute; z-index: 10; color: white; font-weight: 800; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); text-transform: uppercase; letter-spacing: 1px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .liquid-segment:hover .seg-label { opacity: 1; }
        .liquid-segment::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.5); }
        .wave-top { position: absolute; top: -10px; left: -50%; width: 200%; height: 20px; background: inherit; border-radius: 50%; animation: waveMove 2s ease-in-out infinite; opacity: 0.7; }
        @keyframes waveMove { 0%, 100% { transform: translateX(0) scaleY(1); } 50% { transform: translateX(-10%) scaleY(0.6); } }
        .earth-outline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 3px solid rgba(30,58,95,0.15); z-index: 20; pointer-events: none; box-shadow: inset 0 0 40px rgba(0,0,0,0.1); }
        .click-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.9); text-transform: uppercase; letter-spacing: 2px; z-index: 30; opacity: 0; transition: opacity 0.5s; text-shadow: 0 1px 3px rgba(0,0,0,0.5); pointer-events: none; background: rgba(0,0,0,0.3); padding: 6px 14px; border-radius: 20px; }
        .click-hint.show { opacity: 1; }
        .info-popup { position: absolute; right: 50px; top: 50%; transform: translateY(-50%) translateX(50px); background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-radius: 20px; padding: 28px 32px; min-width: 280px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); z-index: 200; border: 1px solid rgba(255,255,255,0.6); opacity: 0; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
        .info-popup.show { opacity: 1; transform: translateY(-50%) translateX(0); pointer-events: auto; }
        .info-popup .popup-title { font-size: 13px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
        .info-popup .popup-name { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .info-popup .popup-value { font-size: 30px; font-weight: 900; margin-bottom: 4px; }
        .info-popup .popup-pct { font-size: 15px; font-weight: 700; color: #64748b; }
        .info-popup .popup-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; margin-top: 12px; overflow: hidden; }
        .info-popup .popup-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; width: 0%; }
        .info-popup .popup-hint { margin-top: 12px; font-size: 11px; font-weight: 700; color: #1e3a5f; text-transform: uppercase; letter-spacing: 1px; padding: 8px 12px; background: rgba(30,58,95,0.08); border-radius: 8px; text-align: center; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.4s ease; display: flex; align-items: center; justify-content: center; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-content { background: white; border-radius: 24px; padding: 0; width: 90%; max-width: 750px; max-height: 85vh; box-shadow: 0 25px 80px rgba(0,0,0,0.3); transform: scale(0.9) translateY(20px); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; display: flex; flex-direction: column; }
        .modal-overlay.show .modal-content { transform: scale(1) translateY(0); }
        .modal-header { padding: 24px 32px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; }
        .modal-header-left { display: flex; align-items: center; gap: 15px; }
        .modal-color { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .modal-header-title { font-size: 24px; font-weight: 900; color: #1e3a5f; text-transform: uppercase; letter-spacing: 1px; }
        .modal-header-subtitle { font-size: 14px; font-weight: 600; color: #64748b; margin-top: 2px; }
        .modal-close { width: 40px; height: 40px; border-radius: 50%; border: none; background: #f1f5f9; color: #64748b; font-size: 20px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: #e2e8f0; color: #1e3a5f; transform: rotate(90deg); }
        .modal-body { padding: 20px 32px 32px; overflow-y: auto; flex: 1; }
        .empresa-item { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 14px; margin-bottom: 10px; transition: all 0.3s; border: 1px solid transparent; }
        .empresa-item:hover { background: rgba(30,58,95,0.03); border-color: rgba(30,58,95,0.1); transform: translateX(5px); }
        .empresa-rank { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: white; flex-shrink: 0; }
        .empresa-logo { width: 80px; height: 50px; object-fit: contain; object-position: center; flex-shrink: 0; border-radius: 8px; padding: 4px; background: white; }
        .empresa-logo-placeholder { width: 80px; height: 50px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; color: white; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
        .empresa-info { flex: 1; }
        .empresa-name { font-size: 15px; font-weight: 800; color: #1e3a5f; text-transform: uppercase; letter-spacing: 0.5px; }

};
let currentStep = 0;
function init() { currentStep = 0; updateEarth(); }
function updateEarth() {
    const liquid = document.getElementById('earth-liquid');
    const counter = document.getElementById('step-counter');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const clickHint = document.getElementById('click-hint');
    liquid.innerHTML = '';
    let accumulatedHeight = 0;
    for (let i = 0; i < currentStep; i++) {
        const d = ventasData[i];
        const segment = document.createElement('div');
        segment.className = 'liquid-segment';
        segment.style.height = d.pct + '%';
        segment.style.background = 'linear-gradient(to top, ' + d.color + ', ' + d.colorLight + ')';
        segment.dataset.index = i;
        segment.onclick = function(e) { e.stopPropagation(); openModal(i); };
        const label = document.createElement('div');
        label.className = 'seg-label';
        label.textContent = d.name;
        segment.appendChild(label);
        const wave = document.createElement('div');
        wave.className = 'wave-top';
        wave.style.background = d.colorLight;
        segment.appendChild(wave);
        liquid.appendChild(segment);
        accumulatedHeight += d.pct;
    }
    liquid.style.height = accumulatedHeight + '%';
    counter.textContent = currentStep + ' / 4';
    btnPrev.disabled = currentStep === 0;
    btnNext.disabled = currentStep === 4;
    if (currentStep > 0) { clickHint.classList.add('show'); } else { clickHint.classList.remove('show'); }
    if (currentStep > 0) { showPopup(ventasData[currentStep - 1]); } else { hidePopup(); }
}
function nextStep() { if (currentStep < 4) { currentStep++; updateEarth(); } }
function prevStep() { if (currentStep > 0) { currentStep--; updateEarth(); } }
function showPopup(data) {
    const popup = document.getElementById('info-popup');
    document.getElementById('popup-name').textContent = data.name;
    document.getElementById('popup-name').style.color = data.color;
    document.getElementById('popup-value').textContent = 'S/ ' + (data.value / 1000000).toFixed(1) + 'M';
    document.getElementById('popup-value').style.color = data.color;
    document.getElementById('popup-pct').textContent = data.pct.toFixed(2) + '% del total';
    document.getElementById('popup-bar-fill').style.background = data.color;
    document.getElementById('popup-bar-fill').style.width = (data.pct / 85.30 * 100) + '%';
    document.getElementById('popup-hint').style.display = 'block';
    popup.classList.add('show');
}
function hidePopup() { document.getElementById('info-popup').classList.remove('show'); }
function openModal(index) {
    const data = ventasData[index];
    const empresas = empresasData[data.name];
    const overlay = document.getElementById('modal-overlay');
    const body = document.getElementById('modal-body');
    document.getElementById('modal-color').textContent = data.emoji;
    document.getElementById('modal-color').style.background = data.color + '20';
    document.getElementById('modal-color').style.color = data.color;
    document.getElementById('modal-title').textContent = data.name;
    document.getElementById('modal-title').style.color = data.color;
    document.getElementById('modal-subtitle').textContent = empresas.length + ' empresas';
    document.getElementById('modal-total').textContent = 'S/ ' + (data.value / 1000000).toFixed(1) + 'M';
    document.getElementById('modal-total').style.color = data.color;
    body.innerHTML = '';
    const maxVenta = Math.max(...empresas.map(function(e) { return e.venta; }));
    empresas.forEach(function(emp, i) {
        const item = document.createElement('div');
        item.className = 'empresa-item';
        item.style.animation = 'fadeInUp 0.4s ease ' + (i * 0.1) + 's forwards';
        item.style.opacity = '0';
        const barWidth = (emp.venta / maxVenta * 100);
        let logoHTML = '';
        if (emp.logo && logosEmpresas[emp.logo]) {
            logoHTML = '<img class="empresa-logo" src="' + logosEmpresas[emp.logo] + '" alt="' + emp.nombre + '">';
        } else {
            logoHTML = '<div class="empresa-logo-placeholder" style="background:' + data.color + ';">' + emp.nombre.substring(0, 3) + '</div>';
        }
        item.innerHTML = '<div class="empresa-rank" style="background:' + data.color + '">' + (i + 1) + '</div>' + logoHTML + '<div class="empresa-info"><div class="empresa-name">' + emp.nombre + '</div><div class="empresa-bar-container"><div class="empresa-bar" style="background:' + data.color + '; width: 0%;"></div></div></div><div class="empresa-values"><div class="empresa-value">S/ ' + formatNumber(emp.venta) + '</div><div class="empresa-pct">' + emp.pct.toFixed(2) + '%</div></div>';
        body.appendChild(item);
        setTimeout(function() { item.querySelector('.empresa-bar').style.width = barWidth + '%'; }, 300 + i * 100);
    });
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
}
function closeModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('modal-overlay').classList.remove('show');
    document.body.style.overflow = '';
}
function formatNumber(num) {
    if (num >= 1000000) { return (num / 1000000).toFixed(1) + 'M'; }
    else if (num >= 1000) { return (num / 1000).toFixed(1) + 'K'; }
    return num.toFixed(0);
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') nextStep();
    if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') prevStep();
    if (e.key === 'Escape') closeModal();
});
init();
</script>
